[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navsecura"
version = "1.0.0"
description = "NavSecura Video Understanding, Tracking and Event Memory Assessment"
authors = [{ name = "NavSecura Engineering Candidate" }]
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0.84",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]

[project.scripts]
navsecura = "navsecura.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

